name: pages

# Builds the self-hosted trail data from OpenSkiMap's published GeoJSON
# downloads and publishes it to GitHub Pages together with the app, so the
# browser loads trails from this site instead of third-party APIs.
#
# Data is rebuilt once a week (cached in between). If OpenSkiMap's download
# server is down, the newest earlier copy is deployed instead; if there is no
# earlier copy yet, the app is deployed without bundled data (it falls back to
# live APIs) and the run is marked failed so it gets noticed. The daily
# schedule retries until a build succeeds.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [claude/peaceful-sagan-3veh0b, main]
  schedule:
    - cron: '17 4 * * *' # daily; rebuilds data only when this week's copy is missing
  workflow_dispatch:
    inputs:
      refresh:
        description: Rebuild trail data even if this week's copy is cached
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      data: ${{ steps.assemble.outputs.data }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Restores this week's data, or failing that the newest older copy.
      - id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: _data
          key: openskimap-data-v1-${{ steps.week.outputs.key }}${{ inputs.refresh && format('-{0}', github.run_id) || '' }}
          restore-keys: openskimap-data-v1-
      - name: Build trail data from OpenSkiMap downloads
        id: build-data
        if: steps.data-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          node --max-old-space-size=6144 scripts/build-data.mjs --out _data_new --download-dir "$RUNNER_TEMP/openskimap"
          rm -rf _data && mv _data_new _data
      - if: steps.build-data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: _data
          key: ${{ steps.data-cache.outputs.cache-primary-key }}
      - name: Assemble site
        id: assemble
        run: |
          mkdir -p _site
          cp -r index.html css js fonts vendor _site/
          touch _site/.nojekyll
          if [ -f _data/index.json ]; then
            cp -r _data _site/data
            echo "Trail data: $(du -sh _site/data | cut -f1), $(ls _site/data/areas | wc -l) ski areas"
            if [ "${{ steps.build-data.outcome }}" = failure ]; then
              echo "::warning::Trail data download failed; deploying the previous copy (${{ steps.data-cache.outputs.cache-matched-key }})"
            fi
            echo "data=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::error::No trail data available (download failed and nothing cached yet); deploying the app without bundled data"
            echo "data=no" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - if: needs.build.outputs.data != 'yes'
        run: |
          echo "::error::Deployed without bundled trail data; the next scheduled run will try again"
          exit 1
