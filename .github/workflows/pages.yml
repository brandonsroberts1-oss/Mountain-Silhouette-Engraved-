name: pages

# Builds the self-hosted trail data from OpenSkiMap's published GeoJSON
# downloads and publishes it to GitHub Pages together with the app, so the
# browser loads trails from this site instead of third-party APIs.
#
# One-time setup: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [claude/peaceful-sagan-3veh0b, main]
  schedule:
    - cron: '17 4 * * 1' # weekly data refresh, Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      refresh:
        description: Rebuild trail data even if this week's copy is cached
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: week
        run: echo "key=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # Restores this week's data, or failing that the newest older copy.
      - id: data-cache
        uses: actions/cache/restore@v4
        with:
          path: _data
          key: openskimap-data-v1-${{ steps.week.outputs.key }}${{ inputs.refresh && format('-{0}', github.run_id) || '' }}
          restore-keys: openskimap-data-v1-
      - name: Build trail data from OpenSkiMap downloads
        id: build-data
        if: steps.data-cache.outputs.cache-hit != 'true'
        # With an older copy restored, a failed download deploys that copy
        # instead of failing the whole site update.
        continue-on-error: ${{ steps.data-cache.outputs.cache-matched-key != '' }}
        run: |
          node --max-old-space-size=6144 scripts/build-data.mjs --out _data_new --download-dir "$RUNNER_TEMP/openskimap"
          rm -rf _data && mv _data_new _data
      - if: steps.build-data.outcome == 'failure'
        run: echo "::warning::Trail data download failed; deploying the previous copy (${{ steps.data-cache.outputs.cache-matched-key }})"
      - if: steps.build-data.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: _data
          key: ${{ steps.data-cache.outputs.cache-primary-key }}
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js fonts vendor _site/
          cp -r _data _site/data
          touch _site/.nojekyll
          du -sh _site/data
          ls _site/data/areas | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
